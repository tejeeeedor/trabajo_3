<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="800" height="600" fill="#1a1a2e"/>
  
  <!-- Título -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#00d9ff" text-anchor="middle">Fundamentos de la Informática</text>
  
  <!-- Hardware - Izquierda -->
  <g transform="translate(150, 180)">
    <rect x="-80" y="-60" width="160" height="120" rx="10" fill="#16213e" stroke="#00d9ff" stroke-width="3"/>
    <text x="0" y="-70" font-family="Arial" font-size="20" font-weight="bold" fill="#00d9ff" text-anchor="middle">HARDWARE</text>
    
    <!-- CPU -->
    <rect x="-50" y="-30" width="40" height="40" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="-35" cy="-15" r="3" fill="#00d9ff"/>
    <circle cx="-25" cy="-15" r="3" fill="#00d9ff"/>
    <circle cx="-35" cy="-5" r="3" fill="#00d9ff"/>
    <circle cx="-25" cy="-5" r="3" fill="#00d9ff"/>
    
    <!-- RAM -->
    <rect x="10" y="-30" width="40" height="15" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <rect x="10" y="-10" width="40" height="15" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <line x1="15" y1="-27" x2="15" y2="-13" stroke="#00d9ff" stroke-width="2"/>
    <line x1="25" y1="-27" x2="25" y2="-13" stroke="#00d9ff" stroke-width="2"/>
    <line x1="35" y1="-27" x2="35" y2="-13" stroke="#00d9ff" stroke-width="2"/>
    <line x1="45" y1="-27" x2="45" y2="-13" stroke="#00d9ff" stroke-width="2"/>
    
    <!-- Disco -->
    <circle cx="0" cy="30" r="25" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="0" cy="30" r="15" fill="#16213e" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="0" cy="30" r="5" fill="#00d9ff"/>
  </g>
  
  <!-- Software - Derecha -->
  <g transform="translate(650, 180)">
    <rect x="-80" y="-60" width="160" height="120" rx="10" fill="#16213e" stroke="#4ecca3" stroke-width="3"/>
    <text x="0" y="-70" font-family="Arial" font-size="20" font-weight="bold" fill="#4ecca3" text-anchor="middle">SOFTWARE</text>
    
    <!-- Ventanas de código -->
    <rect x="-60" y="-35" width="50" height="40" rx="3" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
    <line x1="-55" y1="-30" x2="-15" y2="-30" stroke="#4ecca3" stroke-width="2"/>
    <line x1="-55" y1="-22" x2="-25" y2="-22" stroke="#4ecca3" stroke-width="1.5"/>
    <line x1="-55" y1="-14" x2="-20" y2="-14" stroke="#4ecca3" stroke-width="1.5"/>
    <line x1="-55" y1="-6" x2="-30" y2="-6" stroke="#4ecca3" stroke-width="1.5"/>
    
    <rect x="10" y="-35" width="50" height="40" rx="3" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
    <line x1="15" y1="-30" x2="55" y2="-30" stroke="#4ecca3" stroke-width="2"/>
    <line x1="15" y1="-22" x2="45" y2="-22" stroke="#4ecca3" stroke-width="1.5"/>
    <line x1="15" y1="-14" x2="50" y2="-14" stroke="#4ecca3" stroke-width="1.5"/>
    <line x1="15" y1="-6" x2="40" y2="-6" stroke="#4ecca3" stroke-width="1.5"/>
    
    <!-- App icon -->
    <rect x="-20" y="10" width="40" height="40" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
    <path d="M -10 25 L 0 20 L 10 25 L 10 40 L -10 40 Z" fill="#4ecca3"/>
  </g>
  
  <!-- Proceso central - Datos a Información -->
  <g transform="translate(400, 420)">
    <text x="0" y="-40" font-family="Arial" font-size="18" font-weight="bold" fill="#ff6b6b" text-anchor="middle">Datos → Procesamiento → Información</text>
    
    <!-- Datos -->
    <rect x="-220" y="-20" width="100" height="60" rx="5" fill="#16213e" stroke="#ff6b6b" stroke-width="2"/>
    <text x="-170" y="5" font-family="Arial" font-size="14" fill="#ff6b6b" text-anchor="middle">01010101</text>
    <text x="-170" y="25" font-family="Arial" font-size="14" fill="#ff6b6b" text-anchor="middle">11001100</text>
    
    <!-- Flecha -->
    <path d="M -110 10 L -40 10" stroke="#ff6b6b" stroke-width="3" fill="none"/>
    <path d="M -40 10 L -50 5 L -50 15 Z" fill="#ff6b6b"/>
    
    <!-- Procesamiento -->
    <circle cx="0" cy="10" r="35" fill="#16213e" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M -15 10 L -5 0 L 5 10 L 15 0" stroke="#ff6b6b" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="10" r="3" fill="#ff6b6b"/>
    
    <!-- Flecha -->
    <path d="M 40 10 L 110 10" stroke="#ff6b6b" stroke-width="3" fill="none"/>
    <path d="M 110 10 L 100 5 L 100 15 Z" fill="#ff6b6b"/>
    
    <!-- Información -->
    <rect x="120" y="-20" width="100" height="60" rx="5" fill="#16213e" stroke="#ff6b6b" stroke-width="2"/>
    <text x="170" y="0" font-family="Arial" font-size="16" fill="#ff6b6b" text-anchor="middle">📊</text>
    <text x="170" y="25" font-family="Arial" font-size="12" fill="#ff6b6b" text-anchor="middle">Información</text>
  </g>
</svg>